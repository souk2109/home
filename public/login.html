<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>로그인 - 청약 정보</title>
		<link rel="stylesheet" href="/assets/site.css" />
		<style>
			body {
				display: flex;
				align-items: center;
				justify-content: center;
				min-height: 100vh;
			}
			.login-card {
				width: 100%;
				max-width: 340px;
				padding: 1.5rem;
				border: 1px solid var(--color-border);
				border-radius: 10px;
				margin: 0 1rem;
			}
			.login-card h1 {
				font-size: 1.1rem;
				margin: 0 0 1.25rem;
				text-align: center;
			}
			.login-card label {
				display: flex;
				flex-direction: column;
				font-size: 0.8rem;
				gap: 0.25rem;
				margin-bottom: 0.75rem;
			}
			.login-card input {
				padding: 0.55rem;
				font-size: 16px;
				border: 1px solid #ccc;
				border-radius: 6px;
			}
			.login-card button {
				width: 100%;
				padding: 0.65rem;
				font-size: 1rem;
				border: none;
				border-radius: 6px;
				background: var(--color-primary);
				color: #fff;
				cursor: pointer;
				margin-top: 0.25rem;
			}
			#login-error {
				color: #c0392b;
				font-size: 0.82rem;
				margin: 0.6rem 0 0;
				min-height: 1.2em;
				text-align: center;
			}
		</style>
	</head>
	<body>
		<form class="login-card" id="login-form">
			<h1>청약 정보 로그인</h1>
			<label>
				이메일
				<input type="text" name="email" required autocomplete="username" />
			</label>
			<label>
				비밀번호
				<input type="password" name="password" required autocomplete="current-password" />
			</label>
			<button type="submit">로그인</button>
			<p id="login-error"></p>
		</form>

		<script>
			const form = document.getElementById("login-form");
			const errorEl = document.getElementById("login-error");

			form.addEventListener("submit", async (event) => {
				event.preventDefault();
				errorEl.textContent = "";

				const data = new FormData(form);
				const res = await fetch("/api/login", {
					method: "POST",
					headers: { "content-type": "application/json" },
					body: JSON.stringify({ email: data.get("email"), password: data.get("password") }),
				});

				if (res.ok) {
					location.href = "/";
					return;
				}

				const body = await res.json().catch(() => ({}));
				errorEl.textContent = body.error || "로그인에 실패했습니다.";
			});
		</script>
	</body>
</html>
