<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>임의공급 조회</title>
		<link rel="stylesheet" href="/assets/site.css" />
		<link rel="stylesheet" href="/assets/search-page.css" />
	</head>
	<body>
		<main class="container">
			<h1 class="page-title">임의공급 조회</h1>
			<p class="page-note">접수마감이 지난 공고는 제외됩니다.</p>

			<div id="info-box"></div>

			<form id="search-form" class="search-bar">
				<input type="text" name="houseName" placeholder="주택명으로 검색" />
				<button type="submit">조회</button>
			</form>

			<div id="status"></div>
			<div id="result"></div>
			<div id="pagination" class="pagination"></div>
		</main>

		<footer class="site-footer">
			<div class="container">
				<p>데이터 출처: 국토교통부 청약홈 Open API (공공데이터포털) · 매일 갱신</p>
			</div>
		</footer>

		<script src="/assets/logout.js" defer></script>
		<script>
			// API 응답 필드 전체(24개) 한글 라벨
			window.LISTING_CONFIG = {
				apiPath: "/api/opt/detail",
				modelApiPath: "/api/opt/model",
				announceField: "RCRIT_PBLANC_DE",
				acceptStartField: "SUBSCRPT_RCEPT_BGNDE",
				acceptEndField: "SUBSCRPT_RCEPT_ENDDE",
				// 카드 요약 영역에 노출하는 필드 (나머지는 펼침 시 표시)
				summaryKeys: ["HOUSE_NM", "SUBSCRPT_AREA_CODE_NM", "RCRIT_PBLANC_DE", "SUBSCRPT_RCEPT_BGNDE", "SUBSCRPT_RCEPT_ENDDE"],
				// 이 엔드포인트는 Y/N 플래그 필드가 없음
				ynKeys: [],
				// 금액 필드는 "만원" 단위 접미사를 붙여 표시
				moneyKeys: ["LTTOT_TOP_AMOUNT"],
				unitSuffixes: { TOT_SUPLY_HSHLDCO: "세대" },
				labelHints: {
					SPSPLY_RCEPT_BGNDE: "신혼부부·다자녀·생애최초 등 특별공급 대상자 전용 접수 기간",
					SPSPLY_RCEPT_ENDDE: "신혼부부·다자녀·생애최초 등 특별공급 대상자 전용 접수 기간",
					GNRL_RCEPT_BGNDE: "특별공급 대상이 아닌 일반 신청자 접수 기간",
					GNRL_RCEPT_ENDDE: "특별공급 대상이 아닌 일반 신청자 접수 기간",
				},
				infoBoxHtml: `
					<p><strong>특별공급</strong>은 신혼부부·다자녀·생애최초 등 자격을 가진 사람만 신청 가능한 별도 물량으로, 일반공급보다 먼저 접수합니다.</p>
					<p><strong>일반공급</strong>은 특별공급 대상이 아닌 신청자를 위한 접수입니다.</p>
				`,
				// 주택형별 상세(getOPTLttotPblancMdl) 필드 라벨
				modelLabels: {
					MODEL_NO: "모델번호",
					HOUSE_TY: "주택형",
					SUPLY_HSHLDCO: "일반공급세대수",
					LTTOT_TOP_AMOUNT: "분양최고금액",
				},
				labels: {
					HOUSE_NM: "주택명",
					HOUSE_SECD_NM: "주택구분",
					SUBSCRPT_AREA_CODE_NM: "공급지역",
						HSSPLY_ADRES: "공급위치",
					TOT_SUPLY_HSHLDCO: "공급세대수",
					RCRIT_PBLANC_DE: "모집공고일",
					SUBSCRPT_RCEPT_BGNDE: "청약접수시작일",
					SUBSCRPT_RCEPT_ENDDE: "청약접수종료일",
					SPSPLY_RCEPT_BGNDE: "특별공급접수시작일",
					SPSPLY_RCEPT_ENDDE: "특별공급접수종료일",
					GNRL_RCEPT_BGNDE: "일반공급접수시작일",
					GNRL_RCEPT_ENDDE: "일반공급접수종료일",
					PRZWNER_PRESNATN_DE: "당첨자발표일",
					CNTRCT_CNCLS_BGNDE: "계약시작일",
					CNTRCT_CNCLS_ENDDE: "계약종료일",
					HMPG_ADRES: "홈페이지",
					BSNS_MBY_NM: "시행사",
					MDHS_TELNO: "문의처",
					MVN_PREARNGE_YM: "입주예정월",
					PBLANC_URL: "청약홈 상세페이지",
				},
			};
		</script>
		<script src="/assets/listing-search.js" defer></script>
	</body>
</html>
